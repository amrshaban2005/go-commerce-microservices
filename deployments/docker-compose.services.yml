name: go-commerce-services

services:
  order-service:
    image: order-service:local
    environment:
      APP_ENV: production

      DB_HOST: postgres
      DB_PASSWORD: ${ORDER_DB_PASSWORD}

      RABBITMQ_URL: ${RABBITMQ_URL}
    expose:
      - "6005"
      - "7005"
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7005/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_signal: SIGTERM
    stop_grace_period: 45s

  catalog-write-service:
    image: catalog-write-service:local
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PASSWORD: ${CATALOG_WRITE_DB_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL}
    expose:
      - "6002"
      - "7002"
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7002/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_signal: SIGTERM
    stop_grace_period: 45s

  inventory-service:
    image: inventory-service:local
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks:
      - ecommerce-network
    restart: unless-stopped
    expose:
      - "7004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7004/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_signal: SIGTERM
    stop_grace_period: 45s

  catalog-read-service:
    image: catalog-read-service:local
    environment:
      APP_ENV: production
      MONGO_URI: ${MONGO_URI}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6001"
      - "7001"
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7001/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_signal: SIGTERM
    stop_grace_period: 45s

  api-gateway:
    image: api-gateway:local
    environment:
      APP_ENV: production
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    expose:
      - "7070"
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7070/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_signal: SIGTERM
    stop_grace_period: 45s

networks:
  ecommerce-network:
    external: true
    name: ecommerce-network

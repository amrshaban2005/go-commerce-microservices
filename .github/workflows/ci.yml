name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Check formatting
        run: make fmt-check

      - name: Run vet
        run: make vet

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Run lint
        run: make lint

  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Run unit tests
        run: make test-ci

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-output-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build applications
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Compile deployable applications
        run: make build

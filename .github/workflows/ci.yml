name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Check formatting
        run: make fmt-check

      - name: Run vet
        run: make vet

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Run lint
        run: make lint

  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Run unit tests
        run: make test-ci

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-output-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build applications
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Compile deployable applications
        run: make build

  integration:
    name: Integration tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Run Testcontainers integration tests
        run: make test-integration

  e2e:
    name: System E2E
    if: github.event_name != 'pull_request'
    needs:
      - test
      - build
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-gateway/Dockerfile
          load: true
          tags: api-gateway:local
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: Build catalog read image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/catalog-read-service/Dockerfile
          load: true
          tags: catalog-read-service:local
          cache-from: type=gha,scope=catalog-read-service
          cache-to: type=gha,mode=max,scope=catalog-read-service

      - name: Build catalog write image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/catalog-write-service/Dockerfile
          load: true
          tags: catalog-write-service:local
          cache-from: type=gha,scope=catalog-write-service
          cache-to: type=gha,mode=max,scope=catalog-write-service

      - name: Build inventory image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/inventory-service/Dockerfile
          load: true
          tags: inventory-service:local
          cache-from: type=gha,scope=inventory-service
          cache-to: type=gha,mode=max,scope=inventory-service

      - name: Build order image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/order-service/Dockerfile
          load: true
          tags: order-service:local
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,mode=max,scope=order-service

      - name: Prepare disposable CI configuration
        run: |
          cp deployments/ci.env deployments/.env.infrastructure
          cp deployments/ci.env deployments/.env.services

      - name: Install migration tool
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" go install github.com/pressly/goose/v3/cmd/goose@v3.27.3

      - name: Start infrastructure and migrate databases
        run: |
          make dev-up
          make migrate-up
          make seed-e2e

      - name: Start application services
        run: make deploy-up

      - name: Run E2E tests through API gateway
        env:
          API_GATEWAY_URL: http://127.0.0.1:8080
        run: make test-e2e

      - name: Collect Compose diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/e2e
          docker compose --env-file deployments/.env.infrastructure -f deployments/docker-compose.infrastructure.yml ps --all > artifacts/e2e/infrastructure-status.txt || true
          docker compose --env-file deployments/.env.infrastructure -f deployments/docker-compose.infrastructure.yml logs --no-color > artifacts/e2e/infrastructure.log || true
          docker compose --env-file deployments/.env.services -f deployments/docker-compose.services.yml ps --all > artifacts/e2e/services-status.txt || true
          docker compose --env-file deployments/.env.services -f deployments/docker-compose.services.yml logs --no-color > artifacts/e2e/services.log || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop E2E environment
        if: always()
        run: |
          docker compose --env-file deployments/.env.services -f deployments/docker-compose.services.yml down --remove-orphans || true
          docker compose --env-file deployments/.env.infrastructure -f deployments/docker-compose.infrastructure.yml down --volumes --remove-orphans || true
